[project]
name = "desklink"
version = "0.3.0"
description = "Turn your local computer into a remotely accessible MCP endpoint for cloud AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DeskLink Contributors"}]
keywords = ["mcp", "model-context-protocol", "ai-agents", "mcp-bridge", "oauth", "tunnel", "ngrok"]
dependencies = ["mcp>=1.10.0,<2", "pyngrok>=7.0.0", "typer>=0.12.0", "pydantic>=2.0.0", "pydantic-settings>=2.0.0", "rich>=13.0.0", "uvicorn>=0.30.0", "starlette>=0.40.0", "httpx>=0.27.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[project.scripts]
desklink = "desklink.cli.main:main"
devlink = "desklink.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desklink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
