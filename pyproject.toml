[project]
name = "desklink"
version = "0.1.0"
description = "Turn your local computer into a remotely accessible MCP endpoint for cloud AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DeskLink Contributors"}
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "filesystem", "tunnel", "ngrok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.10.0,<2",
    "uvicorn>=0.30.0",
    "pyngrok>=7.0.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
desklink = "desklink.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desklink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
