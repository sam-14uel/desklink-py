[project]
name = "desklink"
version = "0.3.0"
description = "Turn your local computer into a remotely accessible MCP endpoint for cloud AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Samuel Obinna Chimdi", email = "sam@chat-atp.com"}
]

keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "mcp-bridge",
    "oauth",
    "tunnel",
    "ngrok",
    "desklink"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "mcp>=1.10.0,<2",
    "pyngrok>=7.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/sam-14uel/desklink-py"
Repository = "https://github.com/sam-14uel/desklink-py"
Issues = "https://github.com/sam-14uel/desklink-py/issues"
Documentation = "https://github.com/sam-14uel/desklink-py#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0"
]

[project.scripts]
desklink = "desklink.cli.main:main"
devlink = "desklink.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desklink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]